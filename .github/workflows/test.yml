name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install bash and deps
      run: |
        sudo apt-get update
        sudo apt-get install -y curl perl

    - name: Test plugin loading
      run: |
        bash -c "
          source bash-ai.plugin.bash
          if [[ -z \"\$BASH_AI_PROVIDER\" ]]; then
            echo 'ERROR: Plugin failed to load'
            exit 1
          fi
          echo '✓ Plugin loaded successfully'
          echo \"  Provider: \$BASH_AI_PROVIDER\"
        "

    - name: Test configuration validation
      run: |
        bash -c "
          source bash-ai.plugin.bash

          # Test anthropic provider validation
          export BASH_AI_PROVIDER='anthropic'
          export ANTHROPIC_API_KEY='test-key'
          if _bash_ai_validate_config; then
            echo '✓ Anthropic provider validation passed'
          else
            echo 'ERROR: Anthropic provider validation failed'
            exit 1
          fi

          # Test ollama provider validation
          export BASH_AI_PROVIDER='ollama'
          if _bash_ai_validate_config; then
            echo '✓ Ollama provider validation passed'
          else
            echo 'ERROR: Ollama provider validation failed'
            exit 1
          fi

          # Test invalid provider rejection
          export BASH_AI_PROVIDER='invalid'
          if ! _bash_ai_validate_config 2>/dev/null; then
            echo '✓ Invalid provider correctly rejected'
          else
            echo 'ERROR: Invalid provider not rejected'
            exit 1
          fi
        "

    - name: Test context detection
      run: |
        bash -c "
          source bash-ai.plugin.bash

          # Test project type detection
          touch package.json
          project_type=\$(_bash_ai_detect_project_type)
          if [[ \"\$project_type\" == 'node' ]]; then
            echo '✓ Node.js project detection works'
          else
            echo 'ERROR: Failed to detect Node.js project'
            exit 1
          fi
          rm package.json

          # Test Python project detection
          touch requirements.txt
          project_type=\$(_bash_ai_detect_project_type)
          if [[ \"\$project_type\" == 'python' ]]; then
            echo '✓ Python project detection works'
          else
            echo 'ERROR: Failed to detect Python project'
            exit 1
          fi
        "

    - name: Test bash-ai command exists
      run: |
        bash -c "
          source bash-ai.plugin.bash
          if command -v bash-ai >/dev/null 2>&1; then
            echo '✓ bash-ai command is available'
          else
            echo 'ERROR: bash-ai command not found'
            exit 1
          fi
        "

    - name: Run test suite
      run: |
        chmod +x run-tests-bash.sh
        ./run-tests-bash.sh

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install shellcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck

    - name: Run shellcheck
      run: |
        find . -name "*.bash" -o -name "*.sh" | xargs shellcheck -s bash -e SC1090,SC1091,SC2034,SC2154
