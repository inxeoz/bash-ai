# bash-ai TOML config example
# Copy to $HOME/.config/bash-ai/config.toml (global) or ./.bash-ai.toml / ./bash-ai.toml / ./.bash-ai/config.toml (per-project)
# Precedence: defaults < global < project < env

[general]
# provider: anthropic | openai | openai-compatible | gemini | ollama | qwen | grok | groq | mistral | custom
# openai-compatible is an alias for openai with custom URL (LM Studio, vLLM, LiteLLM, etc.)
provider = "openai"
# optional custom prompt extension appended to system prompt
prompt_extend = "Prefer rg over grep, fd over find."
# pending file for `bash-ai "..."` -> Ctrl-G
# pending_file = "/tmp/bash-ai-pending"
# conversation = { turns = 6, file = "~/.config/bash-ai/conversation.log" }
# search backend: auto | gemini | ddg | off
# search_backend = "auto"
# search_max_results = 5
# answer_max_tokens = 4096

[openai]
# also works as [openai-compatible] or [compatible] — same settings
model = "gpt-5.4-mini"
url = "https://api.openai.com/v1/chat/completions"
# thinking = ""   # 0 or 1
# reasoning_effort = ""  # low | medium | high
# api_key = "sk-..."  # prefer env OPENAI_API_KEY

[anthropic]
model = "claude-haiku-4-5"
url = "https://api.anthropic.com/v1/messages"
# api_key = "..."

[gemini]
model = "gemini-2.5-flash"
# api_key = "..."

[ollama]
model = "llama3.2"
url = "http://localhost:11434"

[qwen]
model = "qwen-flash"
url = "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
# api_key = "..."

[grok]
model = "grok-4.3"
url = "https://api.x.ai/v1/chat/completions"
# api_key = "..."

[groq]
model = "openai/gpt-oss-20b"
url = "https://api.groq.com/openai/v1/chat/completions"
# api_key = "gsk-..."  # GROQ_API_KEY
# reasoning_effort = "low"  # low for gpt-oss to save tokens

[mistral]
model = "mistral-small-latest"
url = "https://api.mistral.ai/v1/chat/completions"
# api_key = "..."

[search]
backend = "auto"
max_results = 5

[answer]
max_tokens = 4096
key = "\C-f"
markdown_renderer = "auto"  # auto | off | glow | mdcat | bat
markdown_theme = "auto"     # auto | light | dark

[conversation]
turns = 6
file = "~/.config/bash-ai/conversation.log"
